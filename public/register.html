<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register — BoardGame Booking</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="col-11 col-md-10 col-lg-8">
      <div class="card auth-card overflow-hidden shadow-lg">
        <div class="row g-0">
          <div class="col-md-5 d-none d-md-block auth-illustration"></div>
          <div class="col-md-7">
            <div class="card-body p-4">
              <a href="/" class="d-inline-block mb-3 brand">🎲 <span class="fw-bold">BoardGameBooking</span></a>
              <h4 class="mb-1">Create your account</h4>
              <p class="text-muted small mb-3">Join the community — book rooms and play with friends.</p>

              <div id="alert" class="alert d-none" role="alert"></div>

              <form id="form" novalidate>
                <div class="mb-3">
                  <label for="username" class="form-label">Full name</label>
                  <input id="username" name="username" class="form-control" required minlength="2" />
                  <div class="invalid-feedback">Please enter your name (at least 2 characters).</div>
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input id="email" name="email" type="email" class="form-control" required />
                  <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <input id="password" name="password" type="password" class="form-control" minlength="6" required />
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">Show</button>
                  </div>
                  <div class="form-text">Minimum 6 characters.</div>
                </div>

                <div class="d-grid mt-3">
                  <button id="submitBtn" type="submit" class="btn btn-primary btn-lg">
                    <span id="submitText">Create account</span>
                  </button>
                </div>
              </form>

              <hr class="my-3">
              <p class="mb-0 small text-center">Already have an account? <a href="/login.html">Login</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- bootstrap bundle for toggles -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    (function () {
      const form = document.getElementById('form');
      const alertBox = document.getElementById('alert');
      const submitBtn = document.getElementById('submitBtn');
      const submitText = document.getElementById('submitText');
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');

      // Toggle password visibility
      togglePassword.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          togglePassword.textContent = 'Hide';
        } else {
          passwordInput.type = 'password';
          togglePassword.textContent = 'Show';
        }
      });

      function showAlert(type, text) {
        alertBox.className = 'alert alert-' + type;
        alertBox.textContent = text;
        alertBox.classList.remove('d-none');
      }

      function hideAlert() {
        alertBox.classList.add('d-none');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        // bootstrap validation
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        const username = form.username.value.trim();
        const email = form.email.value.trim();
        const password = form.password.value;

        // basic checks
        if (password.length < 6) {
          showAlert('danger', 'Password must be at least 6 characters.');
          return;
        }

        // disable UI
        submitBtn.disabled = true;
        submitText.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Creating...';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
          });

          const json = await res.json();
          if (!res.ok) {
            showAlert('danger', json.message || json.error || 'Registration failed');
            submitBtn.disabled = false;
            submitText.textContent = 'Create account';
            return;
          }

          // assume server returns a token
          if (json.token) localStorage.setItem('token', json.token);

          showAlert('success', 'Account created — redirecting...');
          setTimeout(() => { location.href = '/'; }, 900);
        } catch (err) {
          showAlert('danger', 'Network error: ' + err.message);
          console.error(err);
          submitBtn.disabled = false;
          submitText.textContent = 'Create account';
        }
      });
    })();
  </script>
</body>
</html>
